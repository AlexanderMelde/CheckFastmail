name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When a Release PR is merged, build and attach the Chrome Extension .zip artifact
      - name: Checkout repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Install Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Build Chrome Extension
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Package Extension Zip
        if: ${{ steps.release.outputs.release_created }}
        run: |
          cd dist
          zip -r ../checkfastmail-v${{ steps.release.outputs.version }}.zip .
          cd ..

      - name: Upload Extension Zip to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} checkfastmail-v${{ steps.release.outputs.version }}.zip#Checker-for-Fastmail-v${{ steps.release.outputs.version }}.zip
